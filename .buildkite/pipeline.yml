x-round: &round
  - { label: ":rocket: default",       agents: { queue: default },       command: ./pull-bench.sh }
  - { label: ":turtle: unaccelerated", agents: { queue: unaccelerated }, command: ./pull-bench.sh }

steps:
  - { group: ":one: Round 1",   key: round-1, steps: *round }
  - block: ":arrow_forward: Start round 2"
  - { group: ":two: Round 2",   key: round-2, steps: *round }
  - block: ":arrow_forward: Start round 3"
  - { group: ":three: Round 3", key: round-3, steps: *round }
  - wait
  - { label: ":bar_chart: results", agents: { queue: default }, command: ./collect-results.sh }
