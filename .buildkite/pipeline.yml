steps:
  - label: "Go Version"
    commands:
      - go version
    parallelism: 50
    plugins:
      - docker#v5.11.0:
          image: "golang:latest"

  - label: "Node Version"
    command:
    commands:
      - node --version
    parallelism: 50
    plugins:
      - docker#v5.11.0:
          image: "node:latest"
