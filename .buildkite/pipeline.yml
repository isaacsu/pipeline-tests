steps:
  - label: "Carryover probe"
    command:
      - ./probe.sh

  - label: "Go Version"
    command: go version
    plugins:
      - docker#v5.11.0:
          image: "golang:latest"

  - label: "Carryover probe"
    command:
      - ./probe.sh

  - label: "Node Version"
    command: node --version
    plugins:
      - docker#v5.11.0:
          image: "node:latest"

  - label: "Carryover probe"
    command:
      - ./probe.sh
