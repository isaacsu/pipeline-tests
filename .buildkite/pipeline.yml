x-proxy: &proxy "http://buildkite-runner-stack-buildkite-ope-oci-accelerator.buildkite-runner-stack.svc:3128"

x-round: &round
  - { label: ":rocket: default",       agents: { queue: default },       env: { ACCELERATOR_PROXY: *proxy }, command: ./skopeo-bench.sh }
  - { label: ":turtle: unaccelerated", agents: { queue: unaccelerated },                                   command: ./skopeo-bench.sh }

steps:
  - { group: ":one: Round 1",   key: round-1, steps: *round }
  - block: ":arrow_forward: Start round 2"
  - { group: ":two: Round 2",   key: round-2, steps: *round }
  - block: ":arrow_forward: Start round 3"
  - { group: ":three: Round 3", key: round-3, steps: *round }
  - block: ":arrow_forward: Start round 4"
  - { group: ":four: Round 4",  key: round-4, steps: *round }
  - block: ":arrow_forward: Start round 5"
  - { group: ":five: Round 5",  key: round-5, steps: *round }
  - wait
  - { label: ":bar_chart: results", agents: { queue: default }, command: ./collect-results.sh skopeo }
