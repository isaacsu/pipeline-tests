agents:
  queue: "multipool"

steps:
  - label: "Go Version"
    command:
      - go version
      - sleep 5
    parallelism: 500
    plugins:
      - docker#v5.11.0:
          image: "golang:latest"

  - label: "Node Version"
    command:
      - node --version
      - sleep 5
    parallelism: 500
    plugins:
      - docker#v5.11.0:
          image: "node:latest"
